name: Quality checks

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: CSV core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shopify-app:
    name: Shopify app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:ci.sqlite
    defaults:
      run:
        working-directory: csv-import-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            csv-import-doctor/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ github.workspace }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run setup
      - run: npm run test:integration:webhook

  container-image:
    name: Shopify app container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create sensitive-file canaries for .dockerignore
        run: |
          printf '%s\n' 'docker-ignore-canary' > .env.docker-ignore-check
          mkdir -p .shopify playwright/.auth prisma
          printf '%s\n' 'docker-ignore-canary' > .shopify/local-state
          printf '%s\n' 'docker-ignore-canary' > prisma/dev.sqlite
          printf '%s\n' 'docker-ignore-canary' > playwright/.auth/state.json
        working-directory: csv-import-doctor
      - name: Build Docker image
        run: docker build --tag csv-import-doctor:ci .
        working-directory: csv-import-doctor
      - name: Check sensitive local files are absent from image
        run: >-
          docker run --rm --entrypoint sh csv-import-doctor:ci -c
          'test ! -e /app/.env.docker-ignore-check &&
          test ! -e /app/.shopify/local-state &&
          test ! -e /app/prisma/dev.sqlite &&
          test ! -e /app/playwright/.auth/state.json'
