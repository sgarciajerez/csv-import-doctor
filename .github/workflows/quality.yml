name: Quality checks

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: CSV core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shopify-app:
    name: Shopify app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:ci.sqlite
    defaults:
      run:
        working-directory: csv-import-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            csv-import-doctor/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ github.workspace }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Validate Shopify app configuration
        run: npm exec -- shopify app config validate --json
        env:
          SHOPIFY_CLI_NO_ANALYTICS: "1"
      - run: npm run build
      - run: npm run setup
      - run: npm run test:integration:webhook

  container-image:
    name: Shopify app container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create sensitive-file canaries for .dockerignore
        run: |
          printf '%s\n' 'docker-ignore-canary' > .env.docker-ignore-check
          mkdir -p csv-import-doctor/.shopify csv-import-doctor/playwright/.auth csv-import-doctor/prisma
          printf '%s\n' 'docker-ignore-canary' > csv-import-doctor/.shopify/local-state
          printf '%s\n' 'docker-ignore-canary' > csv-import-doctor/prisma/dev.sqlite
          printf '%s\n' 'docker-ignore-canary' > csv-import-doctor/playwright/.auth/state.json
      - name: Build Docker image
        run: docker build --file csv-import-doctor/Dockerfile --tag csv-import-doctor:ci .
      - name: Check sensitive local files are absent from image
        run: >-
          docker run --rm --entrypoint sh csv-import-doctor:ci -c
          'test ! -e /app/.env.docker-ignore-check &&
          test ! -e /app/csv-import-doctor/.shopify/local-state &&
          test ! -e /app/csv-import-doctor/prisma/dev.sqlite &&
          test ! -e /app/csv-import-doctor/playwright/.auth/state.json'
      - name: Smoke test production container
        run: |
          container_name=csv-import-doctor-smoke
          cleanup() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env SHOPIFY_APP_URL=https://example.com \
            --env SHOPIFY_API_KEY=ci-test-api-key \
            --env SHOPIFY_API_SECRET=ci-test-api-secret \
            --env DATABASE_URL=file:/tmp/csv-import-doctor-ci.sqlite \
            csv-import-doctor:ci

          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:3000/healthz 2>/dev/null) && [ "$response" = "ok" ]; then
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              docker logs "$container_name"
              exit 1
            fi

            sleep 1
          done

          docker logs "$container_name"
          exit 1
